name: Test, containerize and publish

on:
  pull_request:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Run tests
        run: python -m pytest -q

  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Prepare image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: debruijn-assembler:ci
      - name: Check FASTQ to FASTA in container
        run: |
          mkdir -p "$RUNNER_TEMP/contigs"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$PWD/tests,dst=/input,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/contigs,dst=/output" \
            debruijn-assembler:ci -i /input/test_two_reads.fq -k 22 -o /output/contigs.fasta
          test -s "$RUNNER_TEMP/contigs/contigs.fasta"
          grep -q '^>contig_' "$RUNNER_TEMP/contigs/contigs.fasta"
      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish versioned image
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
